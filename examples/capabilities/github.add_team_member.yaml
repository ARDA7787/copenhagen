apiVersion: copenhagen/v1
kind: Capability
name: github.add_team_member
version: 1
status: active
owner: team-github
summary: Github add team member
inputs:
  email:
    type: string
    format: email
    sensitive: true
  team:
    type: string
outputs:
  record_id:
    type: string
  status:
    type: string
executor:
  adapter: http
  backend: github
  operation: POST /operations/add_team_member
  queue: github
  allowed_hosts:
  - api.github.com
risk:
  class: identity
  reversible: false
  external_effect: true
data:
  classification: confidential
  output_trust: trusted
retry:
  mode: safe_only
  max_attempts: 3
compensate: none
compensate_reason: Escalate to the domain owner; no safe automatic undo.
verify:
  capability: github.get_team_member@1
  expect:
    output: status
    op: in
    value:
    - succeeded
    - pending
    - active
    - paper_active
  within: 30s
  inputs:
    idempotency_key: ${idempotency_key}
