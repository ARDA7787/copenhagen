apiVersion: copenhagen/v1
kind: Capability
name: payments.refund
version: 1
status: active
owner: team-finance
summary: Payments refund
inputs:
  payment_id:
    type: string
    pattern: ^pi_
    sensitive: true
  amount_cents:
    type: integer
    minimum: 1
    sensitive: true
    unit: cents
  reason:
    type: string
    enum:
    - duplicate
    - requested_by_customer
outputs:
  refund_id:
    type: string
  status:
    type: string
executor:
  adapter: http
  backend: stripe
  operation: POST /operations/refund
  queue: finance
  allowed_hosts:
  - api.stripe.com
risk:
  class: financial
  reversible: false
  external_effect: true
data:
  classification: confidential
  output_trust: trusted
retry:
  mode: safe_only
  max_attempts: 3
compensate: none
compensate_reason: Escalate to the domain owner; no safe automatic undo.
verify:
  capability: payments.get_refund@1
  expect:
    output: status
    op: in
    value:
    - succeeded
    - pending
    - active
    - paper_active
  within: 30s
  inputs:
    idempotency_key: ${idempotency_key}
approval:
  approver_role: approver:finance
  unattended_when:
  - input: amount_cents
    op: lte
    value: 20000
