apiVersion: copenhagen/v1
kind: Capability
name: customers.create_customer
version: 1
status: active
owner: team-customers
summary: Customers create customer
inputs:
  company:
    type: string
    minLength: 1
  owner_email:
    type: string
    format: email
    sensitive: true
outputs:
  customer_id:
    type: string
  status:
    type: string
executor:
  adapter: http
  backend: customers
  operation: POST /operations/customer_create
  queue: customers
  allowed_hosts:
  - customers.example.com
risk:
  class: internal_write
  reversible: false
  external_effect: true
data:
  classification: internal
  output_trust: trusted
retry:
  mode: safe_only
  max_attempts: 3
compensate: none
compensate_reason: Escalate to the domain owner; no safe automatic undo.
verify:
  capability: customers.get_customer@1
  expect:
    output: status
    op: in
    value:
    - succeeded
    - pending
    - active
    - paper_active
  within: 30s
  inputs:
    idempotency_key: ${idempotency_key}
