apiVersion: copenhagen/v1
kind: Capability
name: people.get_google_account
version: 1
status: active
owner: team-people
summary: People get google account
inputs:
  idempotency_key:
    type: string
outputs:
  work_email:
    type: string
    format: email
  status:
    type: string
executor:
  adapter: http
  backend: google
  operation: GET /operations/get_effect
  queue: people
  allowed_hosts:
  - admin.googleapis.com
risk:
  class: read
  reversible: false
  external_effect: false
data:
  classification: internal
  output_trust: trusted
retry:
  mode: safe_only
  max_attempts: 3
compensate: none
compensate_reason: Escalate to the domain owner; no safe automatic undo.
verify: none
verify_reason: Read-only observation
