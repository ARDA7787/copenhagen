apiVersion: copenhagen/v1
kind: Capability
name: trading.get_release
version: 1
status: active
owner: team-trading
summary: Trading get release
inputs:
  idempotency_key:
    type: string
outputs:
  release_id:
    type: string
  status:
    type: string
executor:
  adapter: http
  backend: trading
  operation: GET /operations/get_effect
  queue: trading
  allowed_hosts:
  - trading.example.com
risk:
  class: read
  reversible: false
  external_effect: false
data:
  classification: internal
  output_trust: trusted
retry:
  mode: safe_only
  max_attempts: 3
compensate: none
compensate_reason: Escalate to the domain owner; no safe automatic undo.
verify: none
verify_reason: Read-only observation
