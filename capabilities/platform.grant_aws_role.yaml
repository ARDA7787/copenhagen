apiVersion: copenhagen/v1
kind: Capability
name: platform.grant_aws_role
version: 1
status: active
owner: team-platform
summary: Platform grant aws role
inputs:
  email:
    type: string
    format: email
    sensitive: true
  role:
    type: string
    sensitive: true
outputs:
  record_id:
    type: string
  status:
    type: string
executor:
  adapter: http
  backend: platform
  operation: POST /operations/grant_aws_role
  queue: platform
  allowed_hosts:
  - platform.example.com
risk:
  class: identity
  reversible: false
  external_effect: true
data:
  classification: confidential
  output_trust: trusted
retry:
  mode: safe_only
  max_attempts: 3
compensate: none
compensate_reason: Escalate to the domain owner; no safe automatic undo.
verify:
  capability: platform.get_aws_role@1
  expect:
    output: status
    op: in
    value:
    - succeeded
    - pending
    - active
    - paper_active
  within: 30s
  inputs:
    idempotency_key: ${idempotency_key}
